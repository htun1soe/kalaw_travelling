name: kalaw-travelling

services:
  mariadb:
    build: ./backend/docker/mariadb
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in backend/.env}
      MARIADB_USER: ${DB_USERNAME:?Set DB_USERNAME in backend/.env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in backend/.env}
      MARIADB_ROOT_HOST: localhost
      MARIADB_SUPER_ADMIN_DATABASE: ${SUPER_ADMIN_DB_DATABASE:-kalaw_admins}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  mariadb-data:
